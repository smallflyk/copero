name: Deploy copero.pro

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Finish an in-flight deployment before starting the newest queued main commit.
concurrency:
  group: copero-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test game, translations and Worker
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Check TypeScript
        run: npm run typecheck
      - name: Check SEO export
        run: npm run check:seo
      - name: Stamp build with the Git commit
        run: node scripts/write-release.mjs
      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Add repository Actions secret CLOUDFLARE_API_TOKEN. See docs/automatic-deployment.md.'
            exit 1
          fi
      - name: Deploy existing production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f374eebcbf49e49d869c284792be5d54
        run: npx --no-install wrangler deploy
      - name: Verify deployed commit and main pages
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: node scripts/check-live-deployment.mjs
